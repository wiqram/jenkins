---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  namespace: jenkins
  labels:
    app: jenkins
spec:
  selector:
    matchLabels:
      app: jenkins
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      namespace: jenkins
      labels:
        app: jenkins
    spec:
      serviceAccountName: jenkins-deployer
      automountServiceAccountToken: true
      containers:
        - name: jenkins
          # PINNED — do not put `latest` back. `jenkins/jenkins:latest` is the WEEKLY
          # release line, not LTS: it carries no support window and can ship a breaking
          # change to the only deploy path this cluster has, on any pull. Pinned here to
          # the weekly that was already running (2.576) rather than to LTS 2.568.2,
          # because that LTS is OLDER than what JENKINS_HOME was written by — downgrading
          # core under an existing home risks plugins that require a newer core failing to
          # load. Move to the LTS line at the next LTS baseline >= 2.576, in one
          # deliberate step. Bump this tag on purpose, never by pulling.
          image: jenkins/jenkins:2.576
          imagePullPolicy: IfNotPresent
          env:
            - name: JAVA_OPTS
              value: -Xmx2048m -Dhudson.slaves.NodeProvisioner.MARGIN=50 -Dhudson.slaves.NodeProvisioner.MARGIN0=0.85
          ports:
            - containerPort: 8080
              name: httpport
            - containerPort: 50000
              name: jnlpport
          volumeMounts:
            - mountPath: /var/jenkins_home
              name: jenkins
            - mountPath: /var/run/docker.sock
              name: docker-sock
      restartPolicy: Always
      securityContext:
        runAsUser: 0
      terminationGracePeriodSeconds: 30
      volumes:
        - name: jenkins
          persistentVolumeClaim:
            claimName: jenkins-claim
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
---
#apiVersion: rbac.authorization.k8s.io/v1
#kind: ClusterRoleBinding
#metadata:
#  name: jenkins-deployer
#  namespace: jenkins
#roleRef:
#  apiGroup: rbac.authorization.k8s.io
#  kind: ClusterRole
#  name: cluster-admin
#subjects:
#  - kind: ServiceAccount
#    name: jenkins-deployer
#    namespace: jenkins
---
apiVersion: v1
kind: Service
metadata:
  name: jenkins
  namespace: jenkins
  labels:
    app: jenkins
spec:
  type: NodePort
  ports:
    - name: httpport
      port: 8080
      nodePort: 30380
      targetPort: 8080
     # protocol: TCP
    - name: jnlpport
      port: 50000
      nodePort: 30350
      #protocol: TCP
    - name: http
      port: 80
      #nodePort: 30280
      targetPort: 8080
  selector:
    app: jenkins
